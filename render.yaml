# Optional: use `render blueprint` to spin up the frontend static site
# from this file. Alternatively you can create the service manually in
# the Render dashboard (see DEPLOY.md).
services:
  - type: web
    name: gnc-invoice-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # Route rules complement public/_redirects — Render picks the first match.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gnc-invoice-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    # Security headers appropriate for a static SPA
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
